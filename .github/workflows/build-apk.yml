
name: Build Sponge Cash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip SpongeCashAndroid_Project.zip -d project

      - name: Build APK
        run: |
          cd project/SpongeCashAndroid
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpongeCash-APK
          path: project/SpongeCashAndroid/app/build/outputs/apk/debug/app-debug.apk
