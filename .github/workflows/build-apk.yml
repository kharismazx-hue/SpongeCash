name: Build Sponge Cash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip SpongeCashAndroid_Project.zip -d project

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/SpongeCashAndroid/app/build.gradle.kts")
          s = p.read_text()
          needle = "    compileSdk = 35\n"
          addition = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if "sourceCompatibility" not in s:
              s = s.replace(needle, needle + addition, 1)
              p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project/SpongeCashAndroid
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpongeCash-APK
          path: project/SpongeCashAndroid/app/build/outputs/apk/debug/app-debug.apk
